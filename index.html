<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atomic Launcher 3D is an Android launcher with 3D home screen navigation, customizable tabs, and built-in widgets.">
  <meta name="google-site-verification" content="7tf0dBEAwHc3aHpaEJve_IqL3_RCyCuYWc52MN0kl5o" />
  <title>Atomic Launcher 3D</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #f4f8ff;
      background: #07111e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.25rem;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 85% 10%, #174877 0%, #07111e 63%);
    }

    main {
      width: min(100%, 58rem);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 16rem);
      gap: 1.75rem clamp(1.5rem, 5vw, 3rem);
      align-items: center;
      padding: clamp(1.5rem, 6vw, 4rem);
      background: #0d1d31;
      border: 1px solid #335374;
      border-radius: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    p {
      max-width: 34rem;
      margin: 1.25rem 0 0;
      color: #c5d4e7;
      font-size: 1.125rem;
      line-height: 1.65;
    }

    .intro {
      margin: 0;
      width: min(100%, 16rem);
      justify-self: center;
    }

    .intro video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      background: #000;
      border: 1px solid #335374;
      border-radius: 1rem;
    }

    footer {
      grid-column: 1 / -1;
      padding-top: 1.25rem;
      border-top: 1px solid #335374;
    }

    footer p { margin: 0; font-size: 1rem; }
    a { color: #9dd4ff; overflow-wrap: anywhere; }

    @media (max-width: 40rem) {
      main { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Atomic Launcher 3D</h1>
      <p>Atomic Launcher 3D is an Android launcher with 3D home screen navigation, customizable tabs, and widgets for the clock, weather, calendar, and notes.</p>
    </header>
    <figure class="intro">
      <video controls playsinline preload="none" width="1080" height="1920"
             poster="atomic-intro-poster.webp" aria-label="Atomic Launcher 3D intro animation">
        <source src="atomic-intro.mp4" type="video/mp4">
        <a href="atomic-intro.mp4">Watch the Atomic Launcher 3D intro animation</a>
      </video>
    </figure>
    <footer>
      <p>Published by Softinženjering.</p>
      <p>For support, email <a href="mailto:atomiclauncher3d@gmail.com">atomiclauncher3d@gmail.com</a>.</p>
    </footer>
  </main>
</body>
</html>
